<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#131d39"><title>三視圖挑戰賽</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap');
:root{--ink:#17213b;--muted:#68738e;--blue:#5667f5;--purple:#875df5;--mint:#00b894;--orange:#ffad48;--paper:#f4f6ff;--line:#e7eaf4;--card:#fff;--shadow:0 18px 50px #19244c12}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,'Noto Sans TC',sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.top{height:70px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid var(--line)}.brand{font-weight:900;font-size:18px;display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#5667f5,#9a5df5);display:grid;place-items:center;color:white;font-size:20px}.tag{font-size:12px;color:#7b84a0;background:#f1f2ff;padding:7px 12px;border-radius:20px}.wrap{max-width:1160px;margin:28px auto;padding:0 22px}.hero{background:linear-gradient(120deg,#182442,#293866);border-radius:28px;padding:30px 36px;color:white;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between}.hero:after{content:'▦';position:absolute;font-size:180px;right:17%;top:-57px;color:#ffffff0c;transform:rotate(14deg)}.hero h1{margin:3px 0;font-size:32px;letter-spacing:1px}.hero p{color:#cad3f2;margin:7px 0 0}.hero .star{font-size:75px;z-index:1;filter:drop-shadow(0 8px 10px #ffbf5c44)}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#acb9ff;font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;margin-top:22px}.card{background:var(--card);border:1px solid #eceef7;border-radius:22px;padding:22px;box-shadow:var(--shadow)}.card h2{margin:0 0 16px;font-size:18px}.login{max-width:500px;margin:50px auto;text-align:center;padding:35px}.login h2{font-size:25px}.login .bigicon{font-size:52px}.login input{width:100%;padding:15px;border:1px solid var(--line);border-radius:13px;text-align:center;font-size:21px;letter-spacing:4px;margin:14px 0}.primary,.secondary,.danger{padding:12px 18px;border-radius:12px;font-weight:800;transition:.15s}.primary{color:white;background:linear-gradient(110deg,var(--blue),var(--purple));box-shadow:0 7px 16px #6570ed30}.primary:hover{transform:translateY(-1px);filter:brightness(1.05)}.secondary{background:#eff1ff;color:#5362da}.danger{background:#fff0ef;color:#dc5851}.full{width:100%}.hint{font-size:12px;color:var(--muted);line-height:1.8}.stats{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:15px}.pill{border-radius:30px;padding:8px 13px;font-size:13px;font-weight:800;background:#f0f2ff;color:#505fd8}.pill.green{background:#e4faf2;color:#059969}.pill.amber{background:#fff4de;color:#b67813}.question h2{font-size:21px}.question p{font-size:16px;line-height:1.8;color:#4b5570}.qimg{max-width:100%;max-height:210px;object-fit:contain;border-radius:12px}.gridbox{overflow:auto;padding-bottom:5px}.grid{display:grid;gap:6px;width:max-content;margin:10px auto 18px;touch-action:manipulation}.cell{width:clamp(43px,8vw,68px);aspect-ratio:1;border:2px solid #dfe4f4;border-radius:11px;background:#fafbff;display:grid;place-items:center;color:#a5abc0;font-size:12px;font-weight:700;user-select:none;touch-action:manipulation}.cell.on{background:#5e6cf6;color:#fff;border-color:#5e6cf6;box-shadow:0 4px 10px #5e6cf644}.cell:active{transform:scale(.96)}.celllabel{display:flex;gap:6px;align-items:center}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.feedback{margin:12px auto 0;text-align:center;min-height:25px;font-weight:800}.good{color:#05a775}.bad{color:#e35c54}.side{height:max-content}.score{font-size:39px;color:#5967eb;font-weight:900}.teamtitle{color:var(--muted);font-size:13px}.leader{list-style:none;padding:0;margin:0}.leader li{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid #f0f1f7;font-weight:700}.leader .me{color:#5967eb}.medal{width:22px;display:inline-block}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px}.table th{color:#77809a;font-size:12px}.statusdot{width:9px;height:9px;display:inline-block;border-radius:50%;margin-right:7px;background:#b9c0d4}.statusdot.on{background:#18bf8c}.statusdot.solved{background:#ffae43}.teacher{display:none}.teacher.on{display:block}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{padding:9px 15px;border-radius:12px;background:#f1f2fa;color:#6d7690;font-weight:800}.tab.active{background:#5968ed;color:white}.field{margin:11px 0}.field label{display:block;font-size:12px;color:#68738e;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid #e1e5f0;border-radius:10px;background:#fff;color:var(--ink)}.field textarea{min-height:70px;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.qrow{padding:12px;border:1px solid var(--line);border-radius:13px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}.hidden{display:none!important}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#182442;color:#fff;border-radius:12px;padding:12px 19px;z-index:5;box-shadow:var(--shadow)}.lock{text-align:center;padding:70px 20px}.lock .icon{font-size:55px}.foot{text-align:center;color:#959db1;font-size:12px;margin:22px}
@media(max-width:760px){.top{padding:0 17px}.wrap{margin:17px auto;padding:0 13px}.hero{padding:23px;border-radius:21px}.hero h1{font-size:25px}.hero .star{font-size:53px}.layout{grid-template-columns:1fr}.side{order:-1}.side .leader{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.card{padding:17px}.login{margin:24px auto;padding:26px 20px}.table th,.table td{padding:9px 5px;font-size:12px}.teachergrid{overflow:auto}.twocol{grid-template-columns:1fr}.cell{width:clamp(43px,12vw,60px)}}
/* Student canvas: continuous engineering graph paper. Teacher answers still use row/column coordinates. */
.grid{gap:0;border-top:1px solid #aebdd0;border-left:1px solid #aebdd0;background:#fff}.cell{border:0;border-right:1px solid #aebdd0;border-bottom:1px solid #aebdd0;border-radius:0;background:#fff;color:transparent;font-size:0;box-shadow:none}.cell.on{background:#e53935;border-color:#aebdd0;color:transparent;box-shadow:none}
.wait-card{text-align:center;padding:clamp(24px,5vw,48px)}.wait-icon{font-size:46px;margin:4px 0 12px}.wait-card h2{color:var(--mint);margin-bottom:8px}.wait-card h3{margin:10px 0}.wait-card p{color:var(--muted)}.wait-dots{display:inline-flex;gap:8px;margin:16px 0}.wait-dots i{width:10px;height:10px;background:var(--blue);border-radius:50%;animation:wait-bounce 1s infinite ease-in-out}.wait-dots i:nth-child(2){animation-delay:.15s}.wait-dots i:nth-child(3){animation-delay:.3s}@keyframes wait-bounce{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-8px);opacity:1}}.review-list{display:grid;gap:12px}.review-item{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fbfcff}.review-item h3{margin:3px 0 8px}.review-item p{color:var(--muted);margin:0 0 12px}.review-answer{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.answer-chip{display:inline-flex;padding:5px 9px;border-radius:8px;background:#ffe9e8;color:#b42318;font-weight:800}.review-result{font-weight:800;margin-top:9px}.review-result.good{color:#07976f}.review-result.bad{color:#d94b42}.encouragement{margin-top:18px;padding:16px;border-radius:14px;background:#eef1ff;color:#424fae;font-weight:700;line-height:1.8}@media(max-width:760px){.wait-card{padding:22px 16px}.review-item{padding:13px}}</style></head><body><header class="top"><div class="brand"><span class="logo">▦</span><span>三視圖挑戰賽</span></div><div><span id="connection" class="tag">● 連線中</span> <button id="teacherOpen" class="secondary" style="margin-left:8px;padding:8px 12px">教師入口</button></div></header><main class="wrap"><section class="hero"><div><div class="eyebrow">GRADE 7 · SPATIAL THINKING</div><h1 id="gameTitle">三視圖挑戰賽</h1><p>觀察・推理・合作，一起挑戰空間力！</p></div><div class="star">🏆</div></section><div id="studentRoot"></div><section id="teacherRoot" class="teacher"></section><div class="foot">一起動動腦，讓空間想像力升級！</div></main><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let S=null,lastState='',selectedClass=localStorage.getItem('tv-class')||'701',token=localStorage.getItem('tv-token')||'',teamId=Number(localStorage.getItem('tv-team')||0),teacherToken='',teacher=false,selected=new Set(),feedback='',submitting=false,polling=false,tab='status';
async function api(url,method='GET',data){let r=await fetch('/api/'+url+'?class='+encodeURIComponent(selectedClass),{method,headers:{'Content-Type':'application/json','X-Team-Token':token,'X-Teacher-Token':teacherToken},...(data?{body:JSON.stringify(data)}:{})});let x=await r.json();if(!r.ok)throw Error(x.error||'連線錯誤');return x}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2400)}
function me(){return S?.teams.find(t=>t.id===teamId)}
function render(){if(!S)return;$('#gameTitle').textContent=S.title;$('#connection').textContent='● 已連線';$('#connection').style.color='#07976f';teacher?renderTeacher():renderStudent()}
function renderStudent(){let root=$('#studentRoot'),t=me();if(!t){root.innerHTML=`<div class="card login"><div class="bigicon">🧩</div><h2>準備好加入挑戰了嗎？</h2><p class="hint">輸入班級小組通關密碼，和隊友一起解題！</p><form id="loginForm"><input id="code" inputmode="numeric" maxlength="8" autocomplete="one-time-code"><button class="primary full">進入挑戰 →</button></form></div>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();try{let r=await api('login','POST',{code:$('#code').value.trim()});token=r.token;teamId=r.teamId;selectedClass=r.classCode;localStorage.setItem('tv-class',selectedClass);localStorage.setItem('tv-token',token);localStorage.setItem('tv-team',teamId);selected.clear();lastState='';sync()}catch(err){toast(err.message)}};return}
let q=S.questions[S.current], solved=t.solved[S.current], status=S.status==='setup'?'等待老師開始':S.status==='ended'?'比賽已結束':S.current<0?'等待老師開始':solved?'本題已完成，等老師開題':'作答中';if(S.current>=0&&solved){if(S.current===S.questions.length-1||S.status==='ended')renderStudentReview(root,t);else renderStudentWaiting(root,t);return}let board=q?grid(q,solved):'';
root.innerHTML=`<div class="stats"><span class="pill">🏫 ${h(S.className)}</span><span class="pill">👥 ${h(t.name)}</span><span class="pill">第 ${S.current+1>0?S.current+1:'—'} 題 / ${S.questions.length}</span><span class="pill ${solved?'green':S.status==='active'?'amber':''}">${status}</span></div><div class="layout"><section class="card question"><h2>${q?'✦ '+h(q.title):'等候老師開始遊戲'}</h2>${q?`<p>${h(q.prompt)}</p>${q.image?`<img class="qimg" src="${q.image}" alt="題目圖片">`:''}<div class="gridbox"><div class="grid" id="answerGrid" style="grid-template-columns:repeat(${q.cols},1fr)">${board}</div></div><div class="actions"><button id="clear" class="secondary" ${solved||S.status!=='active'?'disabled':''}>清除重選</button><button id="submit" class="primary" ${solved||S.status!=='active'?'disabled':''}>送出答案 →</button></div><div class="feedback ${feedback==='答對了！'?'good':'bad'}">${h(feedback|| (solved?'🎉 答對了！等老師開放下一題。':''))}</div>`:`<div class="lock"><div class="icon">⏳</div><h3>等老師準備好題目</h3><p class="hint">畫面會自動同步更新，請稍候！</p></div>`}</section><aside class="card side"><div class="teamtitle">🏆 ${h(t.name)}・目前總分</div><div class="score">${t.total}<small style="font-size:16px"> 分</small></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h2 style="font-size:15px">即時排行榜</h2><ol class="leader">${leaderList(t.id)}</ol><button id="logout" class="secondary full" style="margin-top:13px">離開小組</button></aside></div>`;
if(q&&S.status==='active'&&!solved){$('#answerGrid').onclick=e=>{let c=e.target.closest('.cell');if(!c||submitting)return;let id=c.dataset.id;selected.has(id)?selected.delete(id):selected.add(id);c.classList.toggle('on')};$('#clear').onclick=()=>{if(submitting)return;selected.clear();render()};$('#submit').onclick=async()=>{if(submitting||solved)return;submitting=true;const button=$('#submit');button.disabled=true;button.textContent='送出中…';try{let r=await api('answer','POST',{cells:[...selected]});feedback=r.correct?'答對了！':'答案錯誤，請重新作答。';selected.clear();if(r.correct){try{const latest=await api('state');S=latest;lastState=JSON.stringify(latest)}catch{}}submitting=false;render()}catch(err){submitting=false;toast(err.message);render()}}}
wireStudentLogout()
}

function wireStudentLogout(){const button=$('#logout');if(!button)return;button.onclick=async()=>{try{await api('logout','POST',{})}catch{}token='';teamId=0;localStorage.removeItem('tv-token');localStorage.removeItem('tv-team');selected.clear();feedback='';render()}}
function renderStudentWaiting(root,t){const qNo=S.current+1;root.innerHTML=`<div class="stats"><span class="pill">🏫 ${h(S.className)}</span><span class="pill">👥 ${h(t.name)}</span><span class="pill">第 ${qNo} 題 / ${S.questions.length}</span><span class="pill green">已完成</span></div><div class="layout"><section class="card question wait-card" role="status" aria-live="polite"><div class="wait-icon">✅</div><h2>答案已送出！</h2><p>本題已答對並成功記錄。</p><h3>等待進入下一題……</h3><p>請稍候，老師準備好後會進入下一題。</p><span class="wait-dots" aria-hidden="true"><i></i><i></i><i></i></span></section><aside class="card side"><div class="teamtitle">🏆 ${h(t.name)}・目前總分</div><div class="score">${t.total}<small style="font-size:16px"> 分</small></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h2 style="font-size:15px">即時排行榜</h2><ol class="leader">${leaderList(t.id)}</ol><button id="logout" class="secondary full" style="margin-top:13px">離開小組</button></aside></div>`;wireStudentLogout()}
function renderStudentReview(root,t){const latestByQuestion=new Map();for(const a of(t.submissions||[]))latestByQuestion.set(a.question,a);const cards=S.questions.map((q,i)=>{const a=latestByQuestion.get(i),answer=a?(Array.isArray(a.cells)&&a.cells.length?a.cells.map(c=>'<span class="answer-chip">'+h(c)+'</span>').join(''):'<span class="hint">這筆舊紀錄未保存格子答案內容。</span>'):'<span class="hint">尚未作答</span>',result=a?'<div class="review-result '+(a.correct?'good':'bad')+'">結果：'+(a.correct?'✓ 答對':'✗ 答錯')+'</div>':'<div class="review-result">結果：尚無作答紀錄</div>';return `<article class="review-item"><span class="pill">第 ${i+1} 題</span><h3>${h(q.title||'題目 '+(i+1))}</h3><p>${h(q.prompt||'')}</p><div class="review-answer"><b>我的答案：</b>${answer}</div>${result}</article>`}).join('');root.innerHTML=`<div class="stats"><span class="pill">🏫 ${h(S.className)}</span><span class="pill">👥 ${h(t.name)}</span><span class="pill green">答題完成</span></div><div class="layout"><section class="card"><h2>🎉 答題完成！</h2><p class="hint">我的答題回顧</p><div class="review-list">${cards}</div><div class="encouragement">🎉 恭喜你完成全部挑戰！<br>每一次作答都是一次學習與進步的機會！<br>做得很好，看看自己的答題紀錄，複習今天學到的內容吧！</div></section><aside class="card side"><div class="teamtitle">🏆 ${h(t.name)}・目前總分</div><div class="score">${t.total}<small style="font-size:16px"> 分</small></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h2 style="font-size:15px">即時排行榜</h2><ol class="leader">${leaderList(t.id)}</ol><button id="logout" class="secondary full" style="margin-top:13px">離開小組</button></aside></div>`;wireStudentLogout()}

function grid(q,solved){let out='';for(let r=0;r<q.rows;r++)for(let c=0;c<q.cols;c++){let id=String.fromCharCode(65+r)+(c+1),on=selected.has(id);out+=`<button class="cell ${on?'on':''}" data-id="${id}" aria-label="第 ${r+1} 列、第 ${c+1} 欄方格" ${solved?'disabled':''}></button>`}return out}
function leaderList(id){return [...S.teams].sort((a,b)=>b.total-a.total||a.id-b.id).map((t,i)=>`<li class="${id===t.id?'me':''}"><span><i class="medal">${['🥇','🥈','🥉'][i]||'　'}</i>${h(t.name)}</span><span>${t.total} 分</span></li>`).join('')}
function renderTeacher(){let root=$('#teacherRoot');root.classList.add('on');let q=S.questions[S.current];root.innerHTML=`<div class="tabs"><button class="tab ${tab==='status'?'active':''}" data-tab="status">🏁 比賽控制台</button><button class="tab ${tab==='questions'?'active':''}" data-tab="questions">✏️ 題目管理</button><button class="tab ${tab==='records'?'active':''}" data-tab="records">📊 比賽紀錄</button></div>${tab==='status'?`<div class="layout"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>🏫 ${h(S.className)}・小組狀態</h2><span class="pill ${S.status==='active'?'green':''}">${S.status==='setup'?'尚未開始':S.status==='active'?'進行中':'已結束'}</span></div><p class="hint">目前：${S.current<0?'尚未開始':'第 '+(S.current+1)+' 題'}　｜　每題前到答對依序獲得 6 至 1 分</p><div class="teachergrid"><table class="table"><thead><tr><th>小組</th><th>登入狀態</th><th>本題狀態</th><th>總分</th></tr></thead><tbody>${S.teams.map(t=>`<tr><td><b>${h(t.name)}</b></td><td><i class="statusdot ${t.loggedIn?'on':''}"></i>${t.loggedIn?'已登入':'未登入'}</td><td>${S.current<0?'尚未開始':t.solved[S.current]?'✅ 已完成':'作答中'}</td><td><b>${t.total}</b></td></tr>`).join('')}</tbody></table></div><h2 style="margin-top:22px">🏆 即時排行榜</h2><ol class="leader" style="display:grid;grid-template-columns:1fr 1fr;gap:0 18px">${leaderList(0)}</ol><div class="actions" style="justify-content:flex-start;margin-top:18px">${S.status==='setup'?'<button id="start" class="primary">🚀 開始比賽</button>':S.status==='active'?`<button id="next" class="primary">${S.current+1>=S.questions.length?'🏁 全部題目完成':'➡️ 開始第 '+(S.current+2)+' 題'}</button><button id="end" class="danger">結束遊戲</button>`:'<button id="export" class="primary">📥 匯出成績 Excel</button><button id="newgame" class="secondary">重新開始新比賽</button>'}<button id="logoutAll" class="secondary">全班登出</button></div></section><aside class="card"><h2>🔑 小組通關密碼</h2>${S.teams.map(t=>`<div class="qrow"><span>${h(t.name)}</span><b>${h(t.code)}</b></div>`).join('')}<p class="hint">教師密碼由部署管理員設定，請勿分享。<br>將此加入網址提供給學生即可從不同網路連線。</p><div class="field"><label>學生加入網址</label><input readonly value="${location.origin}" onclick="this.select()"></div><div class="field"><label>本題完成順序</label>${S.events.filter(e=>e.question===S.current).length?S.events.filter(e=>e.question===S.current).map(e=>`<div class="qrow">${h(e.rank)}　${h(S.teams.find(t=>t.id===e.teamId)?.name||'')}　${new Date(e.time).toLocaleTimeString('zh-TW')}</div>`).join(''):'<p class="hint">尚無完成紀錄</p>'}</div></aside></div>`:tab==='questions'?questionsPanel():recordsPanel()}`;
root.insertAdjacentHTML('afterbegin','<div class="field" style="max-width:360px"><label>目前管理班級</label><select id="classPicker">'+S.availableClasses.map(c=>'<option value="'+c.code+'"'+(c.code===S.classCode?' selected':'')+'>'+h(c.name)+'（'+c.code+'）</option>').join('')+'</select></div>');root.querySelector('#classPicker').onchange=e=>{selectedClass=e.target.value;localStorage.setItem('tv-class',selectedClass);lastState='';sync()};if(tab==='questions'){let panel=root.querySelector('.layout .card');panel.insertAdjacentHTML('afterbegin',`<section id="dispatchPanel" style="margin-bottom:20px"><h2>📦 跨班級批次派題</h2><p class="hint">以目前班級 ${h(S.className)}（${S.classCode}）的 ${S.questions.length} 題為來源。勾選目標班級後，會複製這套題目與遊戲名稱；各班仍可再獨立編輯。來源與目標班都須尚未開始比賽；已開始的班級請先重置新比賽。</p><form id="dispatchForm"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px">${S.availableClasses.filter(c=>c.code!==S.classCode).map(c=>`<label class="qrow" style="margin:0;gap:8px;cursor:pointer"><input type="checkbox" name="targetCode" value="${c.code}" ${c.status==='setup'?'':'disabled'}><b>${h(c.name)}</b><span class="hint">${c.status==='setup'?'可派題':c.status==='active'?'進行中':'需重置'}・${c.questionCount} 題</span></label>`).join('')}</div><button class="primary" style="margin-top:14px" ${S.status==='setup'?'':'disabled'}>將題目指派給所選班級 →</button></form><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"></section>`)};let df=$('#dispatchForm');if(df)df.onsubmit=async e=>{e.preventDefault();let targetCodes=[...df.querySelectorAll('input[name="targetCode"]:checked')].map(x=>x.value);if(!targetCodes.length){toast('請至少選擇一個目標班級');return}let names=S.availableClasses.filter(c=>targetCodes.includes(c.code)).map(c=>c.name);if(!confirm(`將 ${S.className} 的 ${S.questions.length} 題及遊戲名稱指派至：${names.join('、')}。這些班級目前的題目會被取代，班級名稱與成績保留。確定派題？`))return;try{let r=await api('questions/dispatch','POST',{targetCodes});toast(`已將題目派給 ${r.count} 個班級`)}catch(err){toast(err.message)}};root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderTeacher()});let start=$('#start');if(start)start.onclick=async()=>{try{await api('control/start','POST',{});toast('比賽開始！')}catch(e){toast(e.message)}};let next=$('#next');if(next)next.onclick=async()=>{try{await api('control/next','POST',{});toast('所有小組已同步進入下一題')}catch(e){toast(e.message)}};let end=$('#end');if(end)end.onclick=async()=>{if(confirm('確定結束比賽並公布最終成績？'))try{await api('control/end','POST',{});toast('比賽結束！')}catch(e){toast(e.message)}};let ex=$('#export');if(ex)ex.onclick=async()=>{try{let r=await fetch('/api/export?class='+S.classCode,{headers:{'X-Teacher-Token':teacherToken}});if(!r.ok)throw Error('匯出失敗，請重新登入教師端。');let blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='scores-'+S.classCode+'.xls';a.click();URL.revokeObjectURL(a.href)}catch(e){toast(e.message)}};let ng=$('#newgame');if(ng)ng.onclick=async()=>{if(confirm('重新開始將清除目前賽事分數，題目保留。確定？'))try{await api('control/reset','POST',{});tab='status';toast('新比賽已準備好')}catch(e){toast(e.message)}};let allOut=$('#logoutAll');if(allOut)allOut.onclick=async()=>{if(confirm('確定讓'+S.className+'六組全部登出？目前分數與答題紀錄會保留。'))try{await api('control/logout-all','POST',{});toast('本班六組已登出，分數與紀錄已保留')}catch(e){toast(e.message)}};wireQuestionForm()}
function questionsPanel(){return `<div class="layout"><section class="card"><h2>⚙️ 遊戲設定</h2><form id="cfgform"><div class="twocol"><div class="field"><label>遊戲名稱</label><input name="title" value="${h(S.title)}" required></div><div class="field"><label>班級名稱</label><input name="className" value="${h(S.className)}" required></div></div><button class="secondary">儲存設定</button></form><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h2>✏️ 題目管理 <span class="pill">${S.questions.length} 題</span></h2><p class="hint">每題設定提示、格子和標準答案。答案座標用逗號分隔，例如 A1,B1,C2。</p>${S.questions.map((q,i)=>`<div class="qrow"><span><b>第${i+1}題</b>　${h(q.title)}</span><button class="danger" data-del="${i}">刪除</button></div>`).join('')}<form id="qform"><div class="field"><label>題目名稱</label><input name="title" required placeholder="例如：俯視圖挑戰"></div><div class="field"><label>題目說明</label><textarea name="prompt" required placeholder="請選出從正上方看到的格子"></textarea></div><div class="twocol"><div class="field"><label>方格列數</label><select name="rows">${[4,5,6,7,8].map(n=>`<option ${n===5?'selected':''}>${n}</option>`)}</select></div><div class="field"><label>方格欄數</label><select name="cols">${[4,5,6,7,8].map(n=>`<option ${n===5?'selected':''}>${n}</option>`)}</select></div></div><div class="field"><label>正確格子座標（逗號分隔）</label><input name="answer" required placeholder="A1,A2,B1,B2"></div><div class="field"><label>題目圖片（選填）</label><input name="image" type="file" accept="image/*"></div><button class="primary">＋ 新增題目</button></form></section><aside class="card"><h2>💡 座標小幫手</h2><p class="hint">最上排從 A 開始，最左欄從 1 開始。<br><br>例如選取最上排左邊兩格，以及第二排第一格：<br><b>A1、A2、B1</b><br><br>新增後，下一場比賽會使用最新題目清單。</p></aside></div>`}
function wireQuestionForm(){let cfg=$('#cfgform');if(cfg)cfg.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(cfg));try{await api('config','POST',d);toast('遊戲設定已儲存')}catch(e){toast(e.message)}};let f=$('#qform');if(f)f.onsubmit=async e=>{e.preventDefault();let d=new FormData(f), file=d.get('image'), image='';if(file&&file.size)image=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});try{await api('questions/add','POST',{title:d.get('title'),prompt:d.get('prompt'),rows:Number(d.get('rows')),cols:Number(d.get('cols')),answer:d.get('answer').split(/[，,\s]+/).filter(Boolean).map(x=>x.toUpperCase()),image});toast('題目已新增');}catch(e){toast(e.message)}};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{try{await api('questions/delete','POST',{index:Number(b.dataset.del)});toast('題目已刪除')}catch(e){toast(e.message)}})}
function recordsPanel(){return `<div class="card"><h2>📊 ${S.status==='ended'?'最終成績':'比賽紀錄'}</h2><p class="hint">開始：${S.startedAt?new Date(S.startedAt).toLocaleString('zh-TW'):'尚未開始'}　｜　結束：${S.endedAt?new Date(S.endedAt).toLocaleString('zh-TW'):'—'}</p><div class="teachergrid"><table class="table"><thead><tr><th>組別</th>${S.questions.map((_,i)=>`<th>第${i+1}題</th>`).join('')}<th>總分</th></tr></thead><tbody>${S.teams.map(t=>`<tr><td>${h(t.name)}</td>${S.questions.map((_,i)=>`<td>${t.solved[i]?.points||0}</td>`).join('')}<td><b>${t.total}</b></td></tr>`).join('')}</tbody></table></div><h2 style="margin-top:25px">答題詳細紀錄</h2><div class="teachergrid"><table class="table"><thead><tr><th>題號</th><th>組別</th><th>答題時間</th><th>是否答對</th><th>答錯次數</th><th>完成順序</th><th>本題得分</th></tr></thead><tbody>${S.teams.flatMap(t=>t.submissions.map(x=>`<tr><td>第${x.question+1}題</td><td>${h(t.name)}</td><td>${new Date(x.time).toLocaleTimeString('zh-TW')}</td><td>${x.correct?'✅':'❌'}</td><td>${x.wrongCount}</td><td>${x.rank||'—'}</td><td>${x.points||0}</td></tr>`)).join('')}</tbody></table></div>${S.status==='ended'?'<button id="export" class="primary" style="margin-top:15px">📥 匯出成績 Excel</button>':''}</div>`}
$('#teacherOpen').onclick=async()=>{if(teacher){teacher=false;teacherToken='';$('#teacherRoot').classList.remove('on');renderStudent();return}let p=prompt('請輸入教師密碼');if(p!==null)try{let r=await api('teacher/login','POST',{password:p});teacherToken=r.token;teacher=true;tab='status';renderTeacher()}catch(e){toast(e.message)}};
async function sync(){try{let next=await api('state'),snapshot=JSON.stringify(next);if(S&&(S.current!==next.current||S.classCode!==next.classCode)){feedback='';selected.clear()}S=next;if(snapshot!==lastState){lastState=snapshot;if(token&&!teacher&&!me()){token='';teamId=0;localStorage.removeItem('tv-token');localStorage.removeItem('tv-team')}render()}}catch(e){$('#connection').textContent='● 重新連線中';$('#connection').style.color='#d88a22'}finally{setTimeout(sync,1100)}}sync();
</script></body></html>
